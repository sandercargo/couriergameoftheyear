<style>
:root{--g:#00FF6E;--k:#000;--w:#fff}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.78);z-index:5;overflow:auto}
.card{background:#fff;color:#000;border-radius:18px;max-width:560px;width:calc(100% - 32px);padding:26px 26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);margin:16px;max-height:calc(100% - 32px);overflow:auto;box-sizing:border-box}
.logo{width:120px;display:block;margin:0 auto 8px}
.logo svg{width:100%;height:auto;display:block}
h1{font-family:Poppins,sans-serif;font-weight:800;font-size:clamp(26px,5.4vw,40px);line-height:1.05;margin:4px 0 6px;text-align:center;letter-spacing:-.5px}
.sub{font-family:Poppins,sans-serif;font-weight:600;text-align:center;font-size:15px;margin:0 0 18px}
.sub mark{background:var(--g);padding:2px 8px;border-radius:99px}
.cities{display:grid;gap:10px}
.city{display:flex;align-items:center;justify-content:space-between;border:2px solid #000;border-radius:99px;padding:12px 20px;font:700 18px Poppins,sans-serif;cursor:pointer;background:#fff;transition:.15s}
.city:hover{background:var(--g)}
.city small{font:600 12px Inter,sans-serif;opacity:.7}
.rules{font-size:14px;line-height:1.55;background:#f5f5f5;border-radius:12px;padding:12px 16px;margin-top:6px}
.rules b{background:var(--g);padding:0 4px;border-radius:4px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:10px;font-size:13px}
kbd{font:600 12px Inter,monospace;background:#000;color:#fff;border-radius:6px;padding:2px 7px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
button.go{font:700 17px Poppins,sans-serif;background:var(--g);color:#000;border:0;border-radius:99px;padding:13px 30px;cursor:pointer}
button.go:hover{filter:brightness(.92)}
button.ghost{font:600 14px Poppins,sans-serif;background:#fff;color:#000;border:2px solid #000;border-radius:99px;padding:11px 22px;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:15px;margin:14px 0 6px}
.stats b{font-family:Poppins,sans-serif;text-align:right}
.big{font:800 44px Poppins,sans-serif;text-align:center;margin:6px 0 0}
.big span{background:var(--g);padding:0 12px;border-radius:12px}
.rank{text-align:center;font:700 16px Poppins,sans-serif;margin-top:10px}
.foot{text-align:center;font-size:12px;opacity:.6;margin-top:14px}
#touch{position:fixed;inset:auto 0 0 0;height:180px;display:none;z-index:3;pointer-events:none}
#touch .b{position:absolute;bottom:18px;width:66px;height:66px;border-radius:50%;background:rgba(0,0,0,.55);border:2px solid var(--g);color:var(--g);font:700 22px Poppins,system-ui;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
#touch .b:active{background:var(--g);color:#000}
#menu{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:4;display:none;font:700 13px Poppins,sans-serif;background:#000;color:var(--g);border:2px solid var(--g);border-radius:99px;padding:9px 18px;cursor:pointer}
#menu:hover{background:var(--g);color:#000}
@media (pointer:coarse){#menu{bottom:112px}}
</style>
</head>

// ================= MAP =================
const T=32,N=65,B={BLD:0,ROAD:1,COB:2,WATER:3,BRIDGE:4,GRASS:5,PLAZA:6,ALLEY:7};
const SURF=[0,1,0.7,1,1,0.6,0.8,0.68];
let CITY=null,L=TXT.nl,map,rail,LMS,LMK,LOCS,ADJ;
const at=(x,y)=>(x<0||y<0||x>=N||y>=N)?B.BLD:map[y*N+x];
const set=(x,y,v)=>{if(x>=0&&y>=0&&x<N&&y<N)map[y*N+x]=v;};
const railAt=(x,y)=>(x<0||y<0||x>=N||y>=N)?0:rail[y*N+x];
const isSt=i=>i%9===0||i%9===1;
const blk=(bx,by,fn)=>{for(let ly=0;ly<7;ly++)for(let lx=0;lx<7;lx++){const x=bx*9+2+lx,y=by*9+2+ly;fn(x,y,lx,ly);}};
const mc=document.createElement('canvas');mc.width=mc.height=N*T;const m=mc.getContext('2d');

function genCity(c){
  CITY=c;L=TXT[c.lang];seed=c.seed;document.documentElement.lang=c.lang;
  map=new Uint8Array(N*N);rail=new Uint8Array(N*N);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)map[y*N+x]=(isSt(x)||isSt(y))?B.ROAD:B.BLD;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(c.water(x,y))set(x,y,c.bridges&&isSt(y)?B.BRIDGE:B.WATER);
  const tramRows=new Set();c.trams.forEach(t=>{if(t.ax==='h'){tramRows.add(t.i);tramRows.add(t.i-1);}});
  const [cx0,cy0,cx1,cy1]=c.cob;
  for(let y=cy0;y<=cy1;y++)for(let x=cx0;x<=cx1;x++)if(at(x,y)===B.ROAD&&!tramRows.has(y))set(x,y,B.COB);
  LMS=c.lms;LMK={};LMS.forEach(l=>LMK[l.bx+','+l.by]=l);
  LMS.forEach(l=>blk(l.bx,l.by,(x,y,lx,ly)=>{
    if(at(x,y)!==B.BLD)return;const ring=lx===0||lx===6||ly===0||ly===6;
    switch(l.type){
      case 'plaza':case 'grandplace':set(x,y,B.PLAZA);break;
      case 'park':set(x,y,B.GRASS);break;
      case 'dock':set(x,y,B.WATER);break;
      case 'castle':if(ring)set(x,y,B.COB);break;
      case 'belfry':if(!(lx>=2&&lx<=4&&ly>=2&&ly<=4))set(x,y,B.PLAZA);break;
      case 'church':{const nave=lx>=2&&lx<=4&&ly>=1&&ly<=5,tr=lx>=1&&lx<=5&&ly>=2&&ly<=3;if(!(nave||tr))set(x,y,B.PLAZA);break;}
      case 'station':if(ly>=5)set(x,y,B.PLAZA);break;
      case 'hospital':if(ly===6)set(x,y,B.PLAZA);break;
      case 'fountain':if(lx===3||ly===3||(Math.abs(lx-3)<=1&&Math.abs(ly-3)<=1))set(x,y,B.PLAZA);break;
      case 'palace':case 'mas':if(ring)set(x,y,B.PLAZA);break;
    }
  }));
  {const q=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(at(x,y)===B.BLD&&(at(x+1,y)===B.WATER||at(x-1,y)===B.WATER||at(x,y+1)===B.WATER||at(x,y-1)===B.WATER))q.push([x,y]);q.forEach(([x,y])=>set(x,y,B.COB));}
  for(let by=0;by<7;by++)for(let bx=0;bx<7;bx++){if(LMK[bx+','+by])continue;const r=rnd();if(r<.22)blk(bx,by,(x,y,lx)=>{if(lx===3&&at(x,y)===B.BLD)set(x,y,B.ALLEY);});else if(r<.42)blk(bx,by,(x,y,lx,ly)=>{if(ly===3&&at(x,y)===B.BLD)set(x,y,B.ALLEY);});}
  c.trams.forEach(t=>{for(let k=0;k<N;k++){const x=t.ax==='h'?k:t.i,y=t.ax==='h'?t.i:k,tt=at(x,y);if(tt!==B.BLD&&tt!==B.WATER)rail[y*N+x]|=(t.ax==='h'?1:2);}});
  drawMap();
  // wegennet auto's
  ADJ={};for(let j=0;j<K;j++)for(let i=0;i<K;i++)ADJ[i+','+j]=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[i+a,j+b]).filter(([a,b])=>segOK(i,j,a,b));
  // locaties
  LOCS=[];const pools={};for(const k in c.names)pools[k]=c.names[k].slice();const kinds=['food','office','office','care','home','food','office'];let ki=0;
  for(let by=0;by<7;by++)for(let bx=0;bx<7;bx++){const p=locPoint(bx,by);if(!p)continue;const l=LMK[bx+','+by];
    if(l){if(l.type==='dock')continue;LOCS.push({...p,name:l.kind==='home'?L.homePrefix+l.name:l.name,kind:l.kind||'lm'});continue;}
    let kind=kinds[(ki++)%kinds.length];if(!pools[kind].length)kind='office';if(!pools[kind].length)continue;
    const i=Math.floor(rnd()*pools[kind].length);LOCS.push({...p,name:pools[kind].splice(i,1)[0],kind});}
}

// ================= MAP RENDER =================
const PAL=['#a8472f','#b85a3c','#8f3c2c','#6b6d74','#7c5244','#c2733f','#5a5e66','#9d4b37','#b0644a','#83483a'];
function cobble(px,py,base,v){m.fillStyle=shade(base,-.35);m.fillRect(px,py,T,T);
  for(let j=0;j<4;j++)for(let i=0;i<4;i++){const off=(j%2)*4;m.fillStyle=shade(base,(rnd()-.5)*v);m.fillRect(px+i*8+off-(off&&i===3?4:0)+1,py+j*8+1,6,6);}}
function houseId(x,y){const bx=Math.floor(x/9),by=Math.floor(y/9),lx=x%9-2,ly=y%9-2,half=ly<4?0:1,w=2+(hash(bx,by,half)%2);return hash(bx+CITY.seed,by,half*31+Math.floor(lx/w));}
function bbox(l){let x0=1e9,y0=1e9,x1=-1,y1=-1;blk(l.bx,l.by,(x,y)=>{if(at(x,y)===B.BLD){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}});return x1<0?null:{x:x0*T,y:y0*T,w:(x1-x0+1)*T,h:(y1-y0+1)*T};}
function roof(b,c,e){m.fillStyle=c;m.fillRect(b.x,b.y,b.w,b.h);m.strokeStyle=e||'rgba(0,0,0,.5)';m.lineWidth=2;m.strokeRect(b.x+1,b.y+1,b.w-2,b.h-2);}
function label(txt,x,y,size,rot,col){m.save();m.translate(x,y);if(rot)m.rotate(rot);m.font='700 '+size+'px '+HF;m.textAlign='center';m.textBaseline='middle';m.lineWidth=4;m.lineJoin='round';m.strokeStyle='rgba(0,0,0,.85)';m.strokeText(txt,0,0);m.fillStyle=col||'#fff';m.fillText(txt,0,0);m.restore();}
function drawHQ(){LMS.forEach(l=>{if(l.type!=='hq')return;const b=bbox(l);if(!b)return;roof(b,'#0b0b0b','#000');m.fillStyle=G;m.fillRect(b.x+6,b.y+b.h-14,b.w-12,6);
  if(logoImg.complete&&logoImg.naturalWidth){const w=b.w*.62,h=w*82.494/107.793;m.drawImage(logoImg,b.x+(b.w-w)/2,b.y+(b.h-h)/2-6,w,h);}});}
function drawMap(){
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const t=at(x,y),px=x*T,py=y*T;
    switch(t){
      case B.ROAD:m.fillStyle='#3b3c41';m.fillRect(px,py,T,T);for(let k=0;k<6;k++){m.fillStyle=rnd()<.5?'#36373b':'#43444a';m.fillRect(px+rnd()*30,py+rnd()*30,2,2);}break;
      case B.COB:case B.ALLEY:cobble(px,py,'#7a6f62',.25);break;
      case B.PLAZA:cobble(px,py,'#9a8c78',.18);break;
      case B.WATER:m.fillStyle='#2a5f7c';m.fillRect(px,py,T,T);m.strokeStyle='rgba(180,220,240,.18)';m.lineWidth=1.5;for(let k=0;k<2;k++){const rx=px+rnd()*22,ry=py+rnd()*28;m.beginPath();m.arc(rx+5,ry+6,6,Math.PI*1.15,Math.PI*1.85);m.stroke();}break;
      case B.BRIDGE:m.fillStyle='#7d7166';m.fillRect(px,py,T,T);m.fillStyle='#71665c';for(let k=0;k<4;k++)m.fillRect(px,py+k*8,T,1);
        m.fillStyle='#d8cfc0';if(at(x,y-1)===B.WATER)m.fillRect(px,py,T,3);if(at(x,y+1)===B.WATER)m.fillRect(px,py+T-3,T,3);break;
      case B.GRASS:m.fillStyle='#4a7d3c';m.fillRect(px,py,T,T);for(let k=0;k<5;k++){m.fillStyle='#55893f';m.fillRect(px+rnd()*30,py+rnd()*30,3,2);}break;
      default:m.fillStyle='#2c2b2a';m.fillRect(px,py,T,T);
    }
  }
  const roadish=t=>t===B.ROAD||t===B.COB||t===B.BRIDGE;
  m.fillStyle='rgba(240,240,230,.55)';
  for(let r=0;r<N-1;r+=9)for(let x=0;x<N;x++)if(!isSt(x)&&at(x,r)===B.ROAD&&roadish(at(x,r+1)))m.fillRect(x*T+8,(r+1)*T-1,14,2);
  for(let c=0;c<N-1;c+=9)for(let y=0;y<N;y++)if(!isSt(y)&&at(c,y)===B.ROAD&&roadish(at(c+1,y)))m.fillRect((c+1)*T-1,y*T+8,2,14);
  // fietssuggestiestroken (groen, huisstijl) op de buitenste ring
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const r=railAt(x,y);if(!r)continue;const px=x*T,py=y*T;m.fillStyle='#a9adb3';
    if(r&1){m.fillRect(px,py+9,T,2);m.fillRect(px,py+21,T,2);}if(r&2){m.fillRect(px+9,py,2,T);m.fillRect(px+21,py,2,T);}}
  m.fillStyle='rgba(0,0,0,.34)';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(at(x,y)===B.BLD)m.fillRect(x*T+8,y*T+8,T,T);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(at(x,y)===B.GRASS&&rnd()<.45){const cx=x*T+8+rnd()*16,cy=y*T+8+rnd()*16,r=8+rnd()*6;
    m.fillStyle='rgba(0,0,0,.3)';m.beginPath();m.arc(cx+5,cy+5,r,0,7);m.fill();m.fillStyle='#2f5f2a';m.beginPath();m.arc(cx,cy,r,0,7);m.fill();m.fillStyle='#3e7535';m.beginPath();m.arc(cx-r*.3,cy-r*.3,r*.55,0,7);m.fill();}
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(at(x,y)!==B.BLD)continue;
    const px=x*T,py=y*T,by=Math.floor(y/9),ly=y%9-2,half=ly<4?0:1,id=houseId(x,y),base=PAL[id%PAL.length];
    const ridge=(by*9+2+(half?5.5:2))*T;
    const top=Math.min(py+T,ridge);if(top>py){m.fillStyle=shade(base,.12);m.fillRect(px,py,T,top-py);}
    const bot=Math.max(py,ridge);if(bot<py+T){m.fillStyle=shade(base,-.18);m.fillRect(px,bot,T,py+T-bot);}
    if(ridge>py&&ridge<py+T){m.fillStyle=shade(base,.3);m.fillRect(px,ridge-1,T,2);}
    m.fillStyle='rgba(0,0,0,.45)';
    if(at(x-1,y)===B.BLD&&houseId(x-1,y)!==id)m.fillRect(px,py,1,T);
    if(ly===4)m.fillRect(px,py,T,1);
    if(at(x-1,y)!==B.BLD)m.fillRect(px,py,2,T);if(at(x+1,y)!==B.BLD)m.fillRect(px+T-2,py,2,T);
    if(at(x,y-1)!==B.BLD)m.fillRect(px,py,T,2);if(at(x,y+1)!==B.BLD)m.fillRect(px,py+T-2,T,2);
    if(hash(x,y,7)%5===0){m.fillStyle='rgba(255,255,255,.18)';m.fillRect(px+10,py+(ly%4<2?6:18),10,7);}
  }
  LMS.forEach(l=>{const b=bbox(l);
    const cx=(l.bx*9+5.5)*T,cy=(l.by*9+5.5)*T;
    if(l.type==='grandplace'){m.strokeStyle='#d9b54a';m.lineWidth=4;m.strokeRect((l.bx*9+2)*T+4,(l.by*9+2)*T+4,7*T-8,7*T-8);m.fillStyle='rgba(217,181,74,.25)';m.fillRect((l.bx*9+2)*T+4,(l.by*9+2)*T+4,7*T-8,7*T-8);}
    if(l.type==='fountain'){m.fillStyle='#9fb6c4';m.beginPath();m.arc(cx,cy,26,0,7);m.fill();m.fillStyle='#2a5f7c';m.beginPath();m.arc(cx,cy,20,0,7);m.fill();m.fillStyle='#c9a24a';m.beginPath();m.arc(cx,cy,5,0,7);m.fill();}
    if(!b)return;
    if(l.type==='castle'){roof(b,'#77787d');m.fillStyle='#5d5e63';m.fillRect(b.x+22,b.y+22,b.w-44,b.h-44);m.fillStyle='#8c8d92';
      for(let i=0;i<b.w;i+=10){m.fillRect(b.x+i,b.y,6,6);m.fillRect(b.x+i,b.y+b.h-6,6,6);}for(let i=0;i<b.h;i+=10){m.fillRect(b.x,b.y+i,6,6);m.fillRect(b.x+b.w-6,b.y+i,6,6);}
      [[0,0],[1,0],[0,1],[1,1]].forEach(([a,c])=>{m.fillStyle='#6a6b70';m.beginPath();m.arc(b.x+a*b.w,b.y+c*b.h,13,0,7);m.fill();m.fillStyle='#8c8d92';m.beginPath();m.arc(b.x+a*b.w,b.y+c*b.h,8,0,7);m.fill();});
      m.fillStyle='#4e4f54';m.fillRect(b.x+b.w/2-18,b.y+b.h/2-18,36,36);m.fillStyle='#8c8d92';m.fillRect(b.x+b.w/2-12,b.y+b.h/2-12,24,24);}
    if(l.type==='belfry'){roof(b,'#4a5258');m.fillStyle='#3a4146';m.beginPath();m.moveTo(b.x+b.w/2,b.y+6);m.lineTo(b.x+b.w-6,b.y+b.h/2);m.lineTo(b.x+b.w/2,b.y+b.h-6);m.lineTo(b.x+6,b.y+b.h/2);m.fill();
      m.fillStyle='#e0b43a';m.beginPath();m.arc(b.x+b.w/2,b.y+b.h/2,7,0,7);m.fill();}
    if(l.type==='church'){blk(l.bx,l.by,(x,y)=>{if(at(x,y)===B.BLD){m.fillStyle='#4b535c';m.fillRect(x*T,y*T,T,T);}});m.fillStyle='rgba(255,255,255,.12)';blk(l.bx,l.by,(x,y,lx)=>{if(at(x,y)===B.BLD&&lx===3)m.fillRect(x*T+14,y*T,4,T);});
      m.fillStyle='#3b424a';m.fillRect(cx-22,(l.by*9+7)*T-8,44,30);}
    if(l.type==='station'){roof(b,'#5d6b74');m.fillStyle='rgba(170,210,230,.55)';for(let i=b.x+8;i<b.x+b.w-8;i+=20)m.fillRect(i,b.y+8,12,b.h-16);m.fillStyle='#7b4a2c';m.fillRect(b.x+b.w/2-30,b.y+b.h-26,60,20);}
    if(l.type==='hospital'){roof(b,'#dfe3e6','#9aa1a6');m.fillStyle='#c3c9cd';m.fillRect(b.x+12,b.y+12,b.w-24,b.h-24);m.fillStyle='#d8322e';m.fillRect(cx-28,b.y+b.h/2-9,56,18);m.fillRect(cx-9,b.y+b.h/2-28,18,56);}
    if(l.type==='palace'){roof(b,'#cfc6b4','#8d846f');m.fillStyle='#bdb39e';for(let i=b.x+10;i<b.x+b.w-10;i+=14)m.fillRect(i,b.y+b.h-18,6,12);m.fillStyle='#a79c84';m.fillRect(b.x+14,b.y+14,b.w-28,b.h-44);}
    if(l.type==='mas'){roof(b,'#8a3a2a','#3a140c');for(let k=0;k<4;k++){m.fillStyle=k%2?'#a4493a':'#7a3022';const s=b.w-16-k*22;m.fillRect(b.x+(b.w-s)/2,b.y+(b.h-s)/2,s,s);}m.fillStyle='rgba(180,220,240,.6)';m.fillRect(b.x+b.w/2-6,b.y+8,12,b.h-16);}
  });

  LMS.forEach(l=>{if(l.type==='hq')label(l.name.toUpperCase(),(l.bx*9+5.5)*T,(l.by*9+2)*T-2,13,0,G);});
  CITY.labels(label,at,N,T,B);
}

const K=8,P=k=>(k*9+1)*T;
function segOK(i,j,ii,jj){if(ii<0||jj<0||ii>=K||jj>=K)return false;
  if(j===jj){const y=j*9;for(let x=Math.min(i,ii)*9;x<=Math.max(i,ii)*9+1;x++)for(const yy of [y,y+1]){const t=at(x,yy);if(t===B.BLD||t===B.WATER)return false;}return true;}
  const x=i*9;for(let y=Math.min(j,jj)*9;y<=Math.max(j,jj)*9+1;y++)for(const xx of [x,x+1]){const t=at(xx,y);if(t===B.BLD||t===B.WATER)return false;}return true;}

  bike.stun=1.1;bike.inv=2.3;bike.spd=0;

function solid(x,y,r){const x0=Math.floor((x-r)/T),x1=Math.floor((x+r)/T),y0=Math.floor((y-r)/T),y1=Math.floor((y+r)/T);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(at(tx,ty)!==B.BLD)continue;const cx=clamp(x,tx*T,tx*T+T),cy=clamp(y,ty*T,ty*T+T);if((x-cx)**2+(y-cy)**2<r*r)return true;}return false;}
function updBike(dt){

  else{
    boosting=keys.boost&&b.boost>0&&b.spd>15;
    if(boosting)b.boost=Math.max(0,b.boost-24*dt);

    if(keys.up){if(b.spd<maxS)b.spd=Math.min(maxS,b.spd+(boosting?440:250)*dt);}
    else if(keys.down){b.spd=b.spd>0?Math.max(0,b.spd-500*dt):Math.max(-70,b.spd-170*dt);}
    else b.spd*=1-1.1*dt;
    if(b.spd>maxS)b.spd=Math.max(maxS,b.spd-380*dt);
    const steer=(keys.right?1:0)-(keys.left?1:0);

    if(mission&&mission.stage==='deliver')failMission(CITY.splash+' '+L.lostLoad+' ('+L.fine+')');else big(CITY.splash+' ('+L.fine+')','#9fe0ff',2);

  }

  if(r&&!b.prevRail&&Math.abs(b.spd)>45&&b.inv<=0&&b.stun<=0){
    const ang=Math.atan2(b.vy,b.vx);
    if((r===1&&Math.abs(Math.sin(ang))<.33)||(r===2&&Math.abs(Math.cos(ang))<.33)){stats.rail++;crash(L.rail);}
  }

    peds.forEach(p=>{if(dist(p.x,p.y,b.x,b.y)<150){p.flee=1.6;p.a=Math.atan2(p.y-b.y,p.x-b.x)+R(-.5,.5);}});}
}
function wallHit(imp){if(imp>165&&bike.inv<=0)crash(L.wall);else if(imp>90)shake=Math.max(shake,4);}

function update(dt){

  const sp=Math.hypot(bike.vx,bike.vy),tx=bike.x+bike.vx*.45,ty=bike.y+bike.vy*.45;
  cam.x+=(tx-cam.x)*Math.min(1,4*dt);cam.y+=(ty-cam.y)*Math.min(1,4*dt);
  const baseZ=clamp(Math.min(VW,VH)/640,.75,1.6),tz=baseZ*(1-.2*clamp(sp/260,0,1));
  cam.z+=(tz-cam.z)*Math.min(1,2*dt);
}
function endGame(){
  state='end';document.getElementById('touch').style.display='none';document.getElementById('menu').style.display='none';
  const th=[0,120,300,520,800],names=L.ranks(CITY.river);let rank=names[0];th.forEach((v,i)=>{if(money>=v)rank=names[i];});
  const E=L.end;
  showPanel(`<div class="logo">${LOGO_SVG('#000')}</div><h1>${E.title} · ${CITY.name}</h1>
  <div class="big"><span>${euro(money)}</span></div>
  <div class="rank">${E.rank}${CITY.lang==="fr"?"&nbsp;:":":"} ${rank}</div>
  <div class="stats"><span>${E.del}</span><b>${stats.del}</b><span>${E.fail}</span><b>${stats.fail}</b><span>${E.crash} (${E.rail})</span><b>${stats.crash} (${stats.rail})</b>
  <span>${E.splash}</span><b>${stats.splash}</b><span>${E.ped}</span><b>${stats.ped}</b><span>${E.km}</span><b>${stats.km.toFixed(1)} km</b><span>${E.co2}</span><b>0 g</b></div>
  <div class="btns"><button class="go" id="go">${E.again}</button><button class="ghost" id="back">${E.other}</button></div>`);
}

// ================= RENDER =================
function drawBike(b){
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);
  if(b.inv>0&&Math.floor(tick*12)%2===0&&b.stun<=0)ctx.globalAlpha=.5;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(-14,-6,40,16);
  ctx.fillStyle='#111';ctx.fillRect(-17,-2,10,4);ctx.fillRect(18,-8,8,3);ctx.fillRect(18,5,8,3);
  ctx.fillStyle='#2b2b2b';ctx.fillRect(-12,-1.5,14,3);
  // bak: zwart met groene rand (huisstijl)
  ctx.fillStyle='#0b0b0b';ctx.fillRect(2,-9,20,18);ctx.fillStyle=G;ctx.fillRect(2,-9,20,2);ctx.fillRect(2,7,20,2);ctx.fillRect(20,-9,2,18);ctx.fillRect(2,-9,2,18);
  if(b.carry==='care'){ctx.fillStyle='#f4f4f4';ctx.fillRect(6,-6,13,12);ctx.fillStyle='#d8322e';ctx.fillRect(11,-4,3,8);ctx.fillRect(8.5,-1.5,8,3);}
  else if(b.carry==='catering'){ctx.fillStyle='#fff';ctx.fillRect(5,-6,14,12);ctx.fillStyle='#000';ctx.fillRect(7,-4,4,3);ctx.fillRect(13,1,4,3);}
  else if(b.carry==='pakket'){ctx.fillStyle='#b78a55';ctx.fillRect(5,-6,7,7);ctx.fillRect(12,-2,7,8);ctx.fillStyle='#8a6438';ctx.fillRect(8,-6,1,7);ctx.fillRect(15,-2,1,8);}
  const w=Math.sin(b.wob)*1.5;
  ctx.fillStyle='#444';ctx.fillRect(0,-8,2,16);
  ctx.fillStyle='#000';ctx.fillRect(-6,-8+w*.3,7,3);ctx.fillRect(-6,5-w*.3,7,3);
  ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(-8,0,6,8.5,0,0,7);ctx.fill();
  ctx.fillStyle=G;ctx.fillRect(-13,-1.5,8,3);
  ctx.fillStyle=G;ctx.beginPath();ctx.arc(-6,0,4.6,0,7);ctx.fill();ctx.fillStyle='#000';ctx.fillRect(-8,-.8,4,1.6);
  if(b.boosting){ctx.fillStyle='rgba(0,255,110,.7)';for(let i=0;i<3;i++)ctx.fillRect(-28-Math.random()*14,-6+i*5,10+Math.random()*8,2);}
  ctx.restore();
}
function drawCar(c){
  ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);const w=c.w,h=c.h;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-w/2+5,-h/2+5,w,h);
  ctx.fillStyle=c.col;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-w/2,-h/2,w,h,5);else ctx.rect(-w/2,-h/2,w,h);ctx.fill();
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(-w/2+w*.3,-h/2+3,w*.38,h-6);
  ctx.fillStyle='#9cc7e0';ctx.fillRect(w*.08,-h/2+3,w*.14,h-6);ctx.fillStyle='#7aa5bf';ctx.fillRect(-w*.34,-h/2+4,w*.08,h-8);
  ctx.fillStyle='#fff7c0';ctx.fillRect(w/2-3,-h/2+2,3,4);ctx.fillRect(w/2-3,h/2-6,3,4);
  ctx.fillStyle='#c22';ctx.fillRect(-w/2,-h/2+2,2,4);ctx.fillRect(-w/2,h/2-6,2,4);
  ctx.restore();
}
function drawTram(tr){
  const p=tramPos(tr);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
  const stripe=CITY.id==='bruxelles'?'#e0a526':CITY.id==='antwerpen'?'#f5c400':'#f5c400';
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(-60,-9,128,26);
  for(let s=0;s<3;s++){const x=-62+s*42;ctx.fillStyle='#f2f2ee';ctx.fillRect(x,-13,40,26);ctx.fillStyle=stripe;ctx.fillRect(x,-13,40,4);ctx.fillRect(x,9,40,4);ctx.fillStyle='#cfd6da';ctx.fillRect(x+6,-6,28,12);}
  ctx.fillStyle='#333';ctx.fillRect(-22,-2,8,4);ctx.fillRect(20,-2,8,4);
  ctx.fillStyle='#8fc1dc';ctx.fillRect(58,-11,6,22);ctx.fillRect(-64,-11,4,22);
  ctx.restore();
}
function drawPed(p){
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(p.x+3,p.y+3,5,0,7);ctx.fill();
  ctx.fillStyle=p.col;ctx.beginPath();ctx.ellipse(p.x,p.y,5,4,p.a+Math.PI/2,0,7);ctx.fill();
  ctx.fillStyle='#5a3b28';ctx.beginPath();ctx.arc(p.x,p.y,2.6,0,7);ctx.fill();
}
function drawCandy(c){const s=1+Math.sin(c.ph)*.12;ctx.save();ctx.translate(c.x,c.y);ctx.scale(s,s);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.arc(3,4,8,0,7);ctx.fill();
  // groene halo zodat pickups opvallen
  ctx.strokeStyle='rgba(0,255,110,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.stroke();
  const k=CITY.boost.kind;
  if(k==='cuberdon'){ctx.fillStyle='#7a2a9e';ctx.beginPath();ctx.moveTo(0,-10);ctx.lineTo(7,5);ctx.quadraticCurveTo(0,10,-7,5);ctx.closePath();ctx.fill();ctx.fillStyle='#b25ad6';ctx.beginPath();ctx.moveTo(-1,-7);ctx.lineTo(-4,3);ctx.lineTo(-2,4);ctx.closePath();ctx.fill();}
  else if(k==='handje'){ctx.fillStyle='#c8904f';ctx.beginPath();ctx.arc(0,2,6,0,7);ctx.fill();for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(-5+i*3.3,-5+(i===0||i===3?1.5:0),2.2,0,7);ctx.fill();}ctx.beginPath();ctx.arc(7,2,2.2,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(-2,0,2,0,7);ctx.fill();}
  else{ctx.fillStyle='#d9a441';ctx.fillRect(-8,-6,16,12);ctx.strokeStyle='#a8741f';ctx.lineWidth=1;ctx.beginPath();for(let i=-4;i<=4;i+=4){ctx.moveTo(i,-6);ctx.lineTo(i,6);}for(let j=-2;j<=2;j+=4){ctx.moveTo(-8,j);ctx.lineTo(8,j);}ctx.stroke();ctx.fillStyle='rgba(255,255,255,.85)';ctx.fillRect(-6,-5,4,2);}
  ctx.restore();}
function drawMarker(loc,col,txt){
  const pulse=1+Math.sin(tick*6)*.15;
  ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(loc.x,loc.y,22*pulse,0,7);ctx.stroke();
  ctx.globalAlpha=.25;ctx.fillStyle=col;ctx.beginPath();ctx.arc(loc.x,loc.y,22*pulse,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.font='700 11px '+HF;ctx.textAlign='center';const w=ctx.measureText(txt).width+14;
  pill(loc.x-w/2,loc.y-44,w,18,col);ctx.fillStyle='#000';ctx.textBaseline='middle';ctx.fillText(txt,loc.x,loc.y-35);ctx.textBaseline='alphabetic';
}
function pill(x,y,w,h,col){ctx.fillStyle=col;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,h/2);else ctx.rect(x,y,w,h);ctx.fill();}
function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#111';ctx.fillRect(0,0,cv.width,cv.height);
  if(!bike)return;
  const s=DPR*cam.z,shx=(Math.random()-.5)*shake,shy=(Math.random()-.5)*shake;
  ctx.setTransform(s,0,0,s,cv.width/2-(cam.x+shx)*s,cv.height/2-(cam.y+shy)*s);
  const hw=cv.width/2/s,hh=cv.height/2/s;
  const sx=clamp(Math.floor(cam.x-hw-20),0,N*T),sy=clamp(Math.floor(cam.y-hh-20),0,N*T),ex=clamp(Math.ceil(cam.x+hw+20),0,N*T),ey=clamp(Math.ceil(cam.y+hh+20),0,N*T);
  if(ex>sx&&ey>sy)ctx.drawImage(mc,sx,sy,ex-sx,ey-sy,sx,sy,ex-sx,ey-sy);
  const vis=(x,y,mg)=>x>cam.x-hw-mg&&x<cam.x+hw+mg&&y>cam.y-hh-mg&&y<cam.y+hh+mg;
  candies.forEach(c=>{if(vis(c.x,c.y,20))drawCandy(c);});
  const pickCol='#ffd23f';
  if(mission){const tg=mission.stage==='pickup'?mission.from:mission.to;drawMarker(tg,mission.stage==='pickup'?pickCol:G,mission.stage==='pickup'?L.pickupLbl:L.dropLbl);}
  peds.forEach(p=>{if(vis(p.x,p.y,10))drawPed(p);});
  drawBike(bike);
  cars.forEach(c=>{if(vis(c.x,c.y,40))drawCar(c);});
  trams.forEach(t=>{const p=tramPos(t);if(vis(p.x,p.y,90))drawTram(t);});
  if(mission){const tg=mission.stage==='pickup'?mission.from:mission.to;const d=dist(bike.x,bike.y,tg.x,tg.y);
    if(d>60){const a=Math.atan2(tg.y-bike.y,tg.x-bike.x);ctx.save();ctx.translate(bike.x+Math.cos(a)*42,bike.y+Math.sin(a)*42);ctx.rotate(a);
      ctx.fillStyle=mission.stage==='pickup'?pickCol:G;ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(12,0);ctx.lineTo(-7,-9);ctx.lineTo(-3,0);ctx.lineTo(-7,9);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}}
  ctx.textAlign='center';ctx.font='700 13px '+HF;ctx.lineJoin='round';
  floats.forEach(f=>{ctx.globalAlpha=Math.min(1,f.t*1.5);ctx.lineWidth=3;ctx.strokeStyle='#000';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y);});ctx.globalAlpha=1;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(rain){ctx.fillStyle='rgba(40,70,110,.18)';ctx.fillRect(0,0,VW,VH);ctx.strokeStyle='rgba(190,215,240,.45)';ctx.lineWidth=1;ctx.beginPath();
    for(let i=0;i<140;i++){const x=(i*97.3+tick*260*(1+(i%3)*.2))%(VW+80)-40,y=(i*53.7+tick*720*(1+(i%5)*.1))%(VH+40)-20;ctx.moveTo(x,y);ctx.lineTo(x-5,y+14);}ctx.stroke();}
  drawHUD();
}
function txt(t,x,y,size,col,align,weight){ctx.font=(weight||800)+' '+size+'px '+HF;ctx.textAlign=align||'left';ctx.textBaseline='alphabetic';ctx.lineWidth=Math.max(3,size/5);ctx.strokeStyle='#000';ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.fillStyle=col;ctx.fillText(t,x,y);}
function drawHUD(){
  const sm=VW<600;
  // pager: zwart kaartje, groene tekst (huisstijl)
  const pw=Math.min(640,VW-20),px=(VW-pw)/2,py=sm?8:12,ph=sm?54:58;
  ctx.fillStyle='#000';ctx.beginPath();if(ctx.roundRect)ctx.roundRect(px,py,pw,ph,14);else ctx.rect(px,py,pw,ph);ctx.fill();
  if(pagerFlash>0&&Math.floor(tick*10)%2===0){ctx.strokeStyle=G;ctx.lineWidth=3;ctx.stroke();}
  const lw=sm?44:54;ctx.drawImage(logoImg,px+10,py+(ph-lw*.765)/2,lw,lw*.765);
  ctx.fillStyle='#fff';ctx.font='600 '+(sm?13:15)+'px '+BF;ctx.textAlign='left';ctx.textBaseline='top';
  const tx0=px+lw+20,maxW=pw-(lw+20)-(mission?78:14);
  const words=pagerText().split(' '),lines=[''];words.forEach(w=>{const t=(lines[lines.length-1]+' '+w).trim();if(ctx.measureText(t).width>maxW&&lines.length<2)lines.push(w);else lines[lines.length-1]=t;});
  lines.forEach((l,i)=>{ctx.fillStyle=i===0&&mission?G:'#fff';ctx.fillText(l,tx0,py+(lines.length>1?9:19)+i*(sm?18:20));});
  if(mission){ctx.textAlign='right';ctx.font='800 '+(sm?22:26)+'px '+HF;ctx.fillStyle=mission.time<10&&Math.floor(tick*4)%2?'#ff4d4d':G;ctx.fillText(Math.max(0,Math.ceil(mission.time))+'s',px+pw-12,py+6);
    const tg=mission.stage==='pickup'?mission.from:mission.to;ctx.font='600 12px '+BF;ctx.fillStyle='#bbb';ctx.fillText(Math.round(dist(bike.x,bike.y,tg.x,tg.y)/T*4)+' '+L.m,px+pw-12,py+ph-18);}
  // geld
  const top=py+ph+(sm?28:36);
  txt(euro(money),16,top,sm?26:32,G);
  const mult=1+Math.min(3,Math.floor(streak/2));
  if(mult>1){ctx.font='800 13px '+HF;const lbl='×'+mult+' FOSSIL FREE',w=ctx.measureText(lbl).width+16;pill(16,top+8,w,22,G);ctx.fillStyle='#000';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(lbl,24,top+19.5);ctx.textBaseline='alphabetic';}
  // klok
  const mins=Math.floor(7*60+shiftT/SHIFT*11*60),hh=Math.floor(mins/60),mm=mins%60;
  txt((hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm,VW-16,top,sm?24:30,'#fff','right');
  txt(CITY.name.toUpperCase()+' · '+(rain?L.rain:L.dry),VW-16,top+20,12,rain?'#9fd4ff':G,'right',700);
  // boost
  const bw=sm?130:180,bx=16,by=VH-(touchUI?200:30);
  ctx.fillStyle='#000';pill(bx-3,by-3,bw+6,18,'#000');ctx.fillStyle='#1d3a28';pill(bx,by,bw,12,'#1d3a28');if(bike.boost>1)pill(bx,by,Math.max(12,bw*bike.boost/100),12,G);
  txt(CITY.boost.lbl+'-BOOST'+(touchUI?'':' [SHIFT]'),bx,by-7,11,'#fff','left',700);
  if(bigMsg){const a=Math.min(1,bigMsg.t*2,(bigMsg.T-bigMsg.t)*6);ctx.globalAlpha=a;txt(bigMsg.txt,VW/2,VH*.34,sm?19:28,bigMsg.col,'center');ctx.globalAlpha=1;}
  if(shiftT<9&&!touchUI){ctx.globalAlpha=Math.min(1,(9-shiftT)/2);txt(L.hint,VW/2,VH-62,12,'#fff','center',600);ctx.globalAlpha=1;}
  
}

// ================= SCHERMEN =================
function frame(now){
  const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(state==='play')update(dt);
  if(state==='play'||state==='pause'||state==='end')render();
  else renderTitleBg(now);
  requestAnimationFrame(frame);
}
function renderTitleBg(now){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#111';ctx.fillRect(0,0,cv.width,cv.height);const s=DPR*.8,tcx=(N*T/2)+Math.cos(now/9000)*500,tcy=(N*T/2)+Math.sin(now/7000)*500;
  ctx.setTransform(s,0,0,s,cv.width/2-tcx*s,cv.height/2-tcy*s);ctx.drawImage(mc,0,0);}
function showPanel(html){const ov=document.getElementById('ov');ov.style.display='flex';document.getElementById('panel').innerHTML=html;
  const g=document.getElementById('go');if(g)g.onclick=startGame;const bk=document.getElementById('back');if(bk)bk.onclick=showTitle;
  document.querySelectorAll('.city').forEach(el=>el.onclick=()=>showBrief(el.dataset.c));}
function showTitle(){
  state='title';document.getElementById('touch').style.display='none';document.getElementById('menu').style.display='none';
  showPanel(`<div class="logo">${LOGO_SVG('#000')}</div>
  <h1>Koers door de stad</h1>
  <p class="sub">Course en ville · <mark>fast, fair &amp; fossil free</mark></p>
  <div class="cities">
   <div class="city" data-c="gent">Gent <small>NL · Leie, kasseien, cuberdons</small></div>
   <div class="city" data-c="antwerpen">Antwerpen <small>NL · Schelde, dokken, 3 tramlijnen</small></div>
   <div class="city" data-c="bruxelles">Bruxelles <small>FR · canal, trafic, gaufres</small></div>
  </div>
  <div class="foot">Een knipoog van het Cargo Velo-team · Un clin d’œil de l’équipe Cargo Velo</div>`);
}
function showBrief(id){
  genCity(CITIES[id]);state='brief';
  showPanel(`<div class="logo">${LOGO_SVG('#000')}</div><h1>${CITY.name}</h1>
  <p class="sub"><mark>${CITY.lang==='fr'?'Plus malin, plus rapide, plus propre':'Slimmer, sneller en schoner'}</mark></p>
  <div class="rules">${L.rules(CITY)}</div>
  <div class="btns"><button class="go" id="go">${L.startBtn}</button><button class="ghost" id="back">${L.back}</button></div>`);
}
genCity(CITIES.gent);
showTitle();
requestAnimationFrame(t=>{last=t;frame(t);});
window.__dbg={endNow(){shiftT=SHIFT-.1},showBrief,startGame,get state(){return state},get bike(){return bike},get mission(){return mission},get LOCS(){return LOCS},get CITY(){return CITY},get ADJ(){return ADJ}};
})();
